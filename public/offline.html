<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — Digital Ujjain</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    color: #f5f0e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 { color: #d4af37; font-size: 1.6rem; margin-bottom: 8px; }
  p { color: #f5f0e6cc; max-width: 380px; line-height: 1.5; }
  .emergency {
    margin-top: 28px;
    border: 1px solid #d4af3755;
    border-radius: 12px;
    padding: 16px 24px;
  }
  .emergency div { margin: 6px 0; font-size: 0.95rem; }
  .num { color: #d4af37; font-weight: bold; }
  button {
    margin-top: 24px;
    background: #d4af37;
    color: #0a0a0f;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div style="font-size:3rem;">🛕</div>
  <h1>Aap abhi offline hain</h1>
  <p>Internet connection nahi mil raha. Network wapas aate hi page apne aap refresh ho jayega. Tab tak, ye zaroori emergency numbers yaad rakhein:</p>
  <div class="emergency">
    <div>Police: <span class="num">100</span></div>
    <div>Ambulance: <span class="num">108</span></div>
  </div>
  <button onclick="window.location.reload()">Dobara Try Karein</button>
</body>
</html>
